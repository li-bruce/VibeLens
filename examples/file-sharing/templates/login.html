{% extends "base.html" %}{% block content %}
<main class="login-layout"><section class="intro"><p class="eyebrow">把文件交给对的人</p><h1>你的文件，<br>与你指定的人共享。</h1><p class="lead">上传、选择接收者，然后对方就能下载。<br>所有者和接收者的权限，始终清楚。</p><div class="flow"><span>01 登录</span><b>→</b><span>02 上传</span><b>→</b><span>03 指定共享</span></div></section>
<section class="login-card"><p class="eyebrow">开始使用</p><h2>登录文件渡</h2><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label for="username">演示账号</label><select id="username" name="username">{% for id,name in demo_users %}<option value="{{ id }}">{{ name }} · {{ id }}</option>{% endfor %}</select><label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" required><button class="primary full" type="submit">登录，进入文件列表 <span>↗</span></button></form><div class="demo-hint"><strong>三个账号体验同一条共享流程</strong><p>林舟上传 · 许宁接收 · 周岚未收到共享</p><p>演示密码：<code>file-demo-2026</code></p></div></section></main>
{% endblock %}
