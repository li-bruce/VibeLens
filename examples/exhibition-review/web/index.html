<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Afterlight — exhibition review</title>
  <style>
    body {
      font: 16px/1.5 system-ui;
      background: #edf2f6;
      color: #23374b;
      margin: 0;
      padding: 32px;
    }
    main {
      max-width: 1100px;
      margin: auto;
    }
    h1 {
      font: 42px Georgia;
    }
    section {
      background: white;
      border-radius: 14px;
      padding: 24px;
    }
    .columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    button,
    input {
      font: inherit;
      max-width: 100%;
      margin: 8px 0;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
      background: #2457db;
      color: white;
      border: 0;
      border-radius: 7px;
    }
    img {
      width: 100%;
      image-rendering: auto;
      border-radius: 8px;
      min-height: 80px;
    }
    pre {
      white-space: pre-wrap;
      font: 13px/1.5 monospace;
      background: #f0f3f7;
      padding: 12px;
    }
    .meta {
      color: #587084;
      font-size: 14px;
    }
    a {
      color: #2457db;
    }
    @media (max-width: 700px) {
      body {
        padding: 16px;
      }
      .columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <main>
    <p class="meta">RUNNABLE VIBELENS CASE · SYNTHETIC ARTWORK</p>
    <h1>Afterlight</h1>
    <p>Upload an image, open it for review, then publish the version you reviewed.</p>
    <div class="columns">
      <section>
        <h2>Artist</h2>
        <label>Title <input id="title" value="Light study" /></label
        ><label>PNG image <input id="image" type="file" accept="image/png" /></label
        ><button id="upload">Upload / replace</button>
        <pre id="upload-result">No upload yet</pre>
      </section>
      <section>
        <h2>Reviewer</h2>
        <button id="preview">Open latest image</button>
        <p id="review-version">No image open</p>
        <img id="review-image" alt="The version opened for review" hidden /><button
          id="approve"
          disabled
        >
          Approve opened version
        </button>
        <pre id="review-result">Waiting for an image</pre>
      </section>
      <section>
        <h2>Exhibition</h2>
        <button id="refresh">Refresh exhibition</button>
        <p id="public-version">Nothing published</p>
        <img id="public-image" alt="The published version" hidden />
        <h3>Messages</h3>
        <p id="messages">No messages</p>
      </section>
    </div>
    <p><a href="/graph" target="_blank" rel="noopener">Open VibeLens ↗</a></p>
  </main>
  <script type="module" src="/app.js"></script>
</html>
