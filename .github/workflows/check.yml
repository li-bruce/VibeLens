name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - run: python tools/build_distribution.py
      - run: npm ci --prefix tools/harness-tests
      - run: npm install -g @deepseek-ai/dsh@0.2.2-rc.1 pnpm@10.34.1
      - name: Install and inspect the real plugin bundle
        env:
          DSH_HOME: ${{ runner.temp }}/vibelens-harness
        run: |
          dsh plugin --profile trial add "$PWD/.validation/distribution/dsh-vibelens-0.13.0.tgz"
          dsh --profile trial --dump-config > .validation/harness-config.yml
          grep -q 'name: dsh-vibelens' .validation/harness-config.yml
          VIBELENS_PLUGIN="$DSH_HOME/profiles/trial/node_modules/dsh-vibelens" node tools/harness-tests/test.mjs
          dsh plugin --profile trial remove dsh-vibelens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-runtime
          path: .validation/harness-*
  source-quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/formatting/requirements.txt -r skills/vibelens/requirements.txt
      - run: npm ci --prefix tools/formatting
      - run: python tools/check_source.py --format
      - run: python tests/test_source_quality.py
      - run: node tools/test_detail_panel.mjs
      - run: node tools/test_case_artifacts.mjs
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r examples/delivery/requirements.txt
      - run: python -m pip install -r examples/file-sharing/requirements.txt
      - run: python -m pip install -r skills/vibelens/requirements.txt -r skills/vibelens/requirements-database.txt -r skills/vibelens/requirements-telemetry-test.txt
      - run: python tools/setup_adapters.py
      - run: npm ci --prefix examples/multilanguage
      - run: python tools/check_release_export.py
      - run: python -m unittest discover -s examples/exhibition-review -p test_domain.py
      - run: python tools/verify.py --database
  database-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r skills/vibelens/requirements.txt -r skills/vibelens/requirements-database.txt
      - run: npm ci --prefix tools/database-native
      - run: docker compose -f examples/database-observer/compose.yaml up -d --wait
      - run: python tools/verify_databases.py --live --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-live-evidence
          path: .validation/database-*
      - run: docker compose -f examples/database-observer/compose.yaml down
        if: always()
  timeline-browser:
    # Playwright 1.56 targets supported Ubuntu releases; latest now selects 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r skills/vibelens/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install chromium
      - run: python tools/test_design_browser.py
        env:
          BO_DESIGN_BROWSER_EVIDENCE: .validation/design-browser
      - run: python -m pip install -r docs/review/concept-models-20261104/trial/project/requirements.txt -r skills/vibelens/requirements-database.txt -r skills/vibelens/requirements-telemetry-test.txt
      - run: python tools/test_concept_browser.py
        env:
          BO_CONCEPT_EVIDENCE: .validation/concept-browser
      - run: node tools/test_concept_flow_browser.mjs docs/review/2026-11-06-coupling-flow/concept-browser/focused-recording.json .validation/concept-flow-browser
      - run: python tools/test_edge_colors_browser.py
      - run: python tools/test_graph_quality_browser.py
        env:
          BO_GRAPH_QUALITY_EVIDENCE: .validation/graph-quality-browser
      - run: python tools/test_api_observation_browser.py
        env:
          BO_API_OBSERVATION_EVIDENCE: .validation/api-observation-browser
      - run: python tools/build_site_viewer.py
      - run: node tools/test_scroll_story_browser.mjs
      - run: node tools/test_change_panel_browser.mjs
      - run: node tools/test_glyph_design_browser.mjs
      - run: node tools/test_demo_startup_browser.mjs
        env:
          BO_DEMO_STARTUP_EVIDENCE: .validation/demo-startup-browser
      - run: python tools/test_product_story_browser.py
      - run: node tools/test_case_browser.mjs
        env:
          BO_CASE_BROWSER_EVIDENCE: .validation/file-story/browser
      - run: node tools/test_recording_timeline_browser.mjs
        env:
          BO_TIMELINE_EVIDENCE: .validation/timeline-browser
      - run: node tools/test_timeline_performance.mjs
        env:
          BO_TIMELINE_EVIDENCE: .validation/timeline-performance
      - run: node tools/test_graph_names_browser.mjs
        env:
          BO_NAMES_EVIDENCE: .validation/semantic-names-browser
      - run: node tools/test_caption_bounds_browser.mjs
        env:
          BO_CAPTION_EVIDENCE: .validation/caption-bounds
      - run: node tools/test_trace_lifecycle_browser.mjs
        env:
          BO_LIFECYCLE_EVIDENCE: .validation/lifecycle-browser
      - run: node tools/test_trace_lifecycle_browser.mjs
        env:
          BO_LIFECYCLE_EVIDENCE: .validation/lifecycle-midspan
          BO_RECORD_MIDSPAN: '1'
      - run: node tools/test_trace_lifecycle_browser.mjs
        env:
          BO_LIFECYCLE_EVIDENCE: .validation/lifecycle-registered
          BO_REGISTERED_LIFECYCLE: '1'
      - run: node tools/test_execution_bands_browser.mjs
        env:
          BO_EXECUTION_EVIDENCE: .validation/execution-bands
      - run: node tools/test_execution_bands_browser.mjs
        env:
          BO_EXECUTION_EVIDENCE: .validation/execution-midspan
          BO_EXECUTION_MIDSPAN: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-timeline-browser
          include-hidden-files: true
          path: |
            .validation/timeline-*
            .validation/semantic-names-*
            .validation/lifecycle-*
            .validation/execution-*
            .validation/caption-*
            .validation/graph-quality-browser
            .validation/api-observation-browser
            .validation/demo-startup-browser
            .validation/concept-browser
            .validation/concept-flow-browser
            .validation/edge-colors
            .validation/design-browser
            .validation/clarity-story/browser
            .validation/file-story/browser
            .validation/story-scroll
            .validation/compact-changes
            .validation/glyph-design
