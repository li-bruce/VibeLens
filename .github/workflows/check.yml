name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/formatting/requirements.txt -r skills/vibelens/requirements.txt
      - run: npm ci --prefix tools/formatting
      - run: python tools/check_source.py --format
      - run: python tests/test_source_quality.py
      - run: node tools/test_detail_panel.mjs
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r examples/delivery/requirements.txt
      - run: python -m pip install -r skills/vibelens/requirements.txt -r skills/vibelens/requirements-database.txt
      - run: python tools/setup_adapters.py
      - run: npm ci --prefix examples/multilanguage
      - run: python tools/check_release_export.py
      - run: python tools/verify.py --database
  database-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r skills/vibelens/requirements.txt -r skills/vibelens/requirements-database.txt
      - run: npm ci --prefix tools/database-native
      - run: docker compose -f examples/database-observer/compose.yaml up -d --wait
      - run: python tools/verify_databases.py --live --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-live-evidence
          path: .validation/database-*
      - run: docker compose -f examples/database-observer/compose.yaml down
        if: always()
