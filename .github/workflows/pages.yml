name: Publish introduction

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'skills/vibelens/assets/stategraph-viewer/**'
      - 'tools/build_site_viewer.py'
      - 'tools/build_control_preview.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble the real graph viewer for the recorded case
        run: python tools/build_site_viewer.py
      - name: Upload the static introduction only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
